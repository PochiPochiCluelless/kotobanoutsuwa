for(let i=0;i<N-1;i++){const w0=P[i]*R*s,w1=P[i+1]*R*s,m=Math.max(w0,w1),y0=by-i*dy,y1=y0-dy,gr=c.createLinearGradient(cx-m,0,cx+m,0);gr.addColorStop(0,shade(col,.5));gr.addColorStop(.32,shade(col,1.12));gr.addColorStop(.55,shade(col,1));gr.addColorStop(1,shade(col,.42));c.fillStyle=gr;c.beginPath();c.moveTo(cx-w0,y0);c.lineTo(cx-w1,y1);c.lineTo(cx+w1,y1);c.lineTo(cx+w0,y0);c.closePath();c.fill()}
const wt=P[N-1]*R*s,ty=by-(N-1)*dy;c.fillStyle=shade(col,.3);c.beginPath();c.ellipse(cx,ty,wt,wt*.2,0,0,6.3);c.fill();c.strokeStyle=shade(col,1.2);c.lineWidth=1.5*s;c.stroke();
if(e){c.save();sil(c,P,H,s,cx,by);c.clip();
if(e=='斑')for(let k=0;k<150;k++){c.fillStyle='rgba(40,25,15,'+(.25+rnd()*.4)+')';c.beginPath();c.arc(cx+(rnd()*2-1)*R*s,by-rnd()*MH*H*s,rnd()*2.2*s+.5,0,6.3);c.fill()}
if(e=='貫入'){c.strokeStyle=(col[0]=='#'&&parseInt(col.slice(1,3),16)<90)?'rgba(210,200,180,.4)':'rgba(30,20,12,.5)';c.lineWidth=.9*s;for(let k=0;k<40;k++){let x=cx+(rnd()*2-1)*R*s,y=by-rnd()*MH*H*s;c.beginPath();c.moveTo(x,y);for(let j=0;j<4;j++){x+=(rnd()-.5)*26*s;y+=(rnd()-.3)*22*s;c.lineTo(x,y)}c.stroke()}}
if(e=='艶'){const gr=c.createLinearGradient(cx-R*s*.55,0,cx-R*s*.15,0);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,'rgba(255,255,255,.3)');gr.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=gr;c.fillRect(cx-R*s,by-MH*H*s,R*s*2,MH*H*s)}
c.restore()}}
function wheel(T){g.fillStyle='#2a221b';g.beginPath();g.ellipse(CX,BY+10,R*1.25,26,0,0,6.3);g.fill();g.strokeStyle='#4a3b2d';g.lineWidth=2;g.stroke();g.strokeStyle='rgba(216,206,185,.18)';g.setLineDash([14,20]);g.lineDashOffset=-T*60;g.beginPath();g.ellipse(CX,BY+10,R*1.1,20,0,0,6.3);g.stroke();g.setLineDash([])}
function fire(T){g.fillStyle='#0d0a08';g.fillRect(0,0,480,420);const hh=40+temp*170;
g.fillStyle='#3a2a1c';g.fillRect(150,350,180,16);
for(let i=0;i<9;i++){const x=170+i*17,f=hh*(.7+.5*Math.abs(Math.sin(T*5+i*1.7))),gr=g.createLinearGradient(0,350-f,0,350);gr.addColorStop(0,'rgba(255,220,120,.0)');gr.addColorStop(.4,'rgba(255,170,60,.85)');gr.addColorStop(1,'rgba(200,60,20,.95)');g.fillStyle=gr;g.beginPath();g.moveTo(x-12,350);g.quadraticCurveTo(x,350-f*1.1,x+Math.sin(T*3+i)*6,350-f);g.quadraticCurveTo(x+4,350-f*.6,x+12,350);g.fill()}
vessel(g,P,H,shade(GL[gl],.6+temp*.7),'',.42,CX,330,1);g.fillStyle='rgba(255,120,40,'+temp*.25+')';g.fillRect(0,0,480,420);
g.fillStyle='#2a221b';g.fillRect(34,60,18,260);g.fillStyle='rgba(120,160,110,.5)';g.fillRect(34,320-.8*260,18,.25*260);g.fillStyle='#d9633a';g.fillRect(34,320-temp*260,18,temp*260);
g.fillStyle='#d8ceb9';g.font='13px serif';g.fillText('温度',30,50);g.fillText('残り '+Math.max(0,Math.ceil(10-tt))+' 秒',360,50)}
function frame(now){const T=now/1000,dt=Math.min(.1,(now-last)/1000||0);last=now;
if(stage<4){g.clearRect(0,0,480,420)}
if(stage==0||stage==1){g.fillStyle='#1d1812';g.fillRect(0,0,480,420);wheel(T);vessel(g,P,H,stage?GL[gl]:'#9c7a58','',1,CX,BY,1)}
else if(stage==2){temp=Math.max(0,temp-dt*.11);tt+=dt;if(temp>.55&&temp<.8)inb+=dt;if(tt>=10)endKiln();fire(T)}
else if(stage==3){g.fillStyle='#1d1812';g.fillRect(0,0,480,420);g.globalAlpha=Math.min(1,(T-t0)/2);wheel(0);vessel(g,P,H,GL[gl],eff,1,CX,BY,seed);g.globalAlpha=1;if(T-t0<2.2){g.fillStyle='rgba(255,170,90,'+(.5*(1-(T-t0)/2.2))+')';g.fillRect(0,0,480,420)}}
if(stage!=2&&stage<4)drawT();requestAnimationFrame(frame)}
/* 操作 */
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*480/r.width,(e.clientY-r.top)*420/r.height]}
function shape(e){if(stage!=0)return;const[x,y]=pos(e),dy=MH*H/N,top=BY-(N-1)*dy;let i=Math.round((BY-y)/dy);if(y<top-4){H=Math.min(1.3,H+(top-y)/900);i=N-1}i=Math.max(0,Math.min(N-1,i));const tg=Math.max(.12,Math.min(1,Math.abs(x-CX)/R));
for(let j=0;j<N;j++){const w=Math.exp(-((j-i)**2)/12);P[j]+=(tg-P[j])*w*.45}
for(let j=1;j<N-1;j++)P[j]=(P[j-1]+P[j]*2+P[j+1])/4;sw(90+Math.random()*30,60,.08,'sine',.05);if(Math.random()<.2)nse(.08,.05)}
cv.onpointerdown=e=>{aud();if(stage==2)stoke();drag=1;cv.setPointerCapture(e.pointerId);shape(e)};cv.onpointermove=e=>{if(drag)shape(e)};cv.onpointerup=()=>drag=0;
addEventListener('keydown',e=>{if(e.code=='Space'&&stage==2){e.preventDefault();stoke()}});
function stoke(){temp=Math.min(1,temp+.13);nse(.2,.25);sw(200,90,.2,'sawtooth',.04)}
function shapeKind(){const av=P.reduce((a,b)=>a+b)/N,mx=Math.max(...P);return H>1.02&&av<.46?'sky':av>.58&&H<.97?'food':P[N-1]<.62*mx?'home':'life'}
function endKiln(){const r=inb/10;eff=r>.75?'艶':r>.45?'斑':'貫入';const gp={'白':'life','青磁':'sky','黒':'home','飴':'food'}[gl],pool=WD[Math.random()<.6?gp:shapeKind()];word=pick(pool&&pool.length?pool:WD.all);sc=sim();price=Math.max(300,Math.round(8000*Math.pow(sc,1.5)*(gl==tg.g?1:.45)*({'艶':1.4,'斑':1,'貫入':.6})[eff]/100)*100);seed=1+Math.floor(Math.random()*1e6);stage=3;t0=performance.now()/1000;nse(1.2,.2);bell(523,500,.08);bell(659,700,.08);bell(784,900,.08);ui()}
function save(){shelf.push({p:P.map(v=>+v.toFixed(3)),h:H,g:gl,e:eff,w:word,s:seed,c:price});persist()}
function ui(){$('st').textContent=ST[stage];$('gm').textContent='目標 ¥'+goal()+'　所持 ¥'+total();const u=$('ui');cv.style.display=stage==4?'none':'block';$('sh').style.display=stage==4?'flex':'none';
if(stage==0){msg('左上の「お題」と同じ形に、回る土をドラッグして整える。\n横へ引くと膨らみ・縮み、上へ引くと背が伸びる。');u.innerHTML='<button onclick="go(1)">この形で、釉薬へ</button>'}
if(stage==1){msg('お題の色を思い出して、釉薬を選ぶ。');u.innerHTML=Object.keys(GL).map(k=>`<span class="sw${k==gl?' on':''}" title="${k}" style="background:${GL[k]}" onclick="gl='${k}';ui()"></span>`).join('')+'<button onclick="go(2)">窯へ入れる</button><button onclick="go(0)">形にもどる</button>'}
if(stage==2){msg('窯の火を見守る。\n温度を、緑の帯の中に保つ。「薪をくべる」(スペースキーでも)。');u.innerHTML='<button onclick="stoke()">薪をくべる</button>'}
if(stage==3){msg('窯を開ける。窯変:'+({'艶':'艶(つや)が出た','斑':'斑(まだら)に焼けた','貫入':'貫入(ひび)が走った'})[eff]+'\nお題との近さ '+Math.round(sc*100)+'%　釉薬:'+(gl==tg.g?'一致':'ちがう')+'\n値段 ¥'+price+'\n器の底の言葉:「'+word+'」');u.innerHTML='<button onclick="put()">棚にしまう</button>'}
if(stage==4){msg((shelf.length?'棚に並んだ器。タップすると、言葉が読める。':'棚は、まだ空っぽ。')+'\n次の目標は ¥'+goal()+'。');u.innerHTML='<button onclick="go(0)">もう一つ作る</button>';rs()}}
function put(){save();stage=4;ui();if(total()>=goal()){lv++;persist();setTimeout(ending,500)}}
function ending(){const e=$('en');e.style.display='block';$('ei').style.opacity=0;$('et').style.opacity=0;$('eb').style.opacity=0;setTimeout(()=>$('ei').style.opacity=1,60);setTimeout(()=>$('et').style.opacity=1,3000);setTimeout(()=>$('eb').style.opacity=1,6000);bell(523,300,.08);bell(659,700,.08);bell(784,1100,.08);bell(1047,1500,.06);$('gm').textContent='目標 ¥'+goal()+'　所持 ¥'+total();msg('次の目標は ¥'+goal()+'。')}
function op0(){aud();const o=$('op');o.style.opacity=0;setTimeout(()=>o.style.display='none',900)}
function go(s){if(s==0){init()}else{stage=s;if(s==2){temp=.3;inb=0;tt=0;aud()}}ui()}
function init(){newTarget();P=[];for(let i=0;i<N;i++)P.push(.36+.14*Math.sin(Math.PI*i/N));H=1;gl='白';eff='';stage=0}
function rs(){const s=$('sh');s.innerHTML='';shelf.forEach(v=>{const d=document.createElement('div');d.style.cssText='width:112px;text-align:center;font-size:11px;line-height:1.5';const c=document.createElement('canvas');c.width=c.height=200;const x=c.getContext('2d');x.fillStyle='#1d1812';x.fillRect(0,0,200,200);vessel(x,v.p,v.h,GL[v.g],v.e,.5,100,170,v.s);c.onclick=()=>msg('「'+v.w+'」\n¥'+(v.c||0)+'('+v.g+'の釉薬、'+v.e+')');c.style.cssText='width:112px;height:112px';d.appendChild(c);const q=document.createElement('div');q.innerHTML='「'+(v.w.length>12?v.w.slice(0,12)+'…':v.w)+'」<br>¥'+(v.c||0);d.appendChild(q);s.appendChild(d)})}
init();ui();requestAnimationFrame(frame);
</script></body></html>
